# =============================================================================
# The platform's single public entrypoint.
#
# Everything else — Postgres, Redis, MinIO and the six microservices — lives on
# the compose bridge with no published port, so this file describes the entire
# externally reachable surface of the deployment.
# =============================================================================

# Docker's embedded DNS. nginx resolves an `upstream` block's hostname ONCE at
# startup and caches the address forever, so recreating a container — which
# gives it a new IP — left nginx dialling a dead address and answering 502 for
# every request until nginx itself was restarted. Every redeploy broke the site.
#
# Resolving through a variable defers the lookup to request time and honours
# this TTL, so a rebuilt service is picked up on its own.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

server {
    listen 80;
    server_name _;

    # A calibration certificate is a scan: the app accepts up to 50 MB and the
    # gateway is configured to match. nginx defaults to 1 MB, which would
    # reject every real upload with a 413 before it ever reached the gateway.
    client_max_body_size 50M;

    # Do not buffer a 50 MB upload to disk before forwarding it.
    proxy_request_buffering off;

    # Identity of the original caller, so the gateway logs something useful.
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Do not advertise the exact nginx build to the internet.
    server_tokens off;

    # Basic hardening for a browser-facing app.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Liveness probe for the container healthcheck.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # --- API -----------------------------------------------------------------
    # No trailing slash on proxy_pass: the gateway routes on the full
    # /api/v1/... path, so the prefix must be preserved rather than stripped.
    location /api/ {
        # A variable in proxy_pass forces per-request DNS resolution. nginx
        # cannot then infer the upstream URI, so $request_uri is appended
        # explicitly — it carries the full path and query string.
        set $gateway_upstream http://auth-gateway:8000;
        proxy_pass $gateway_upstream$request_uri;

        # Upload returns 202 immediately and OCR runs in the background, so
        # these do not need to cover a full extraction — but a cold gateway
        # waiting on Postgres can still be slow to answer.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # --- Frontend ------------------------------------------------------------
    location / {
        set $frontend_upstream http://web-frontend:3000;
        proxy_pass $frontend_upstream$request_uri;

        # Next.js dev/HMR and any future websocket use.
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
    }
}
