networks:
  metrology-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  minio_data:

services:
  # ==========================================
  # 1. INFRASTRUCTURE SERVICES
  # ==========================================

  postgres:
    image: postgres:16-alpine
    container_name: metrology_postgres
    restart: always
    environment:
      POSTGRES_DB: metrology_db
      POSTGRES_USER: metrology_admin
      POSTGRES_PASSWORD: SecretPassword123!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - metrology-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U metrology_admin -d metrology_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: metrology_redis
    restart: always
    command: redis-server --save 60 1 --loglevel warning --requirepass RedisSecret123!
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - metrology-net
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "RedisSecret123!", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: metrology_minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: MinioSecretPassword123!
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - metrology-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  createbuckets:
    image: minio/mc:latest
    container_name: metrology_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minio_admin MinioSecretPassword123!;
      /usr/bin/mc mb myminio/metrology-certificates --ignore-existing;
      /usr/bin/mc mb myminio/audit-reports --ignore-existing;
      /usr/bin/mc anonymous set download myminio/metrology-certificates;
      exit 0;
      "
    networks:
      - metrology-net

  # ==========================================
  # 2. MICROSERVICES
  # ==========================================

  auth-gateway:
    build:
      context: ./services/auth-gateway
      dockerfile: Dockerfile
    container_name: service_auth_gateway
    restart: always
    environment:
      PORT_GATEWAY: 8000
      JWT_SECRET: SuperSecretJwtKey2026ProcessInstruments!
      POSTGRES_DSN: "postgres://metrology_admin:SecretPassword123!@postgres:5432/metrology_db?sslmode=disable"
      REDIS_URL: "redis://:RedisSecret123!@redis:6379/0"
      DOCUMENT_SERVICE_URL: "http://document-ingestion:8001"
      OCR_SERVICE_URL: "http://ocr-parsing:8002"
      METROLOGY_SERVICE_URL: "http://metrology-engine:8003"
      AI_SERVICE_URL: "http://ai-anomaly:8004"
      MINIO_PUBLIC_BASE_URL: "http://minio:9000"
      DEFAULT_ADMIN_USERNAME: "fati_sadiki"
      DEFAULT_ADMIN_PASSWORD: "fati2004@"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - metrology-net

  document-ingestion:
    build:
      context: ./services/document-ingestion
      dockerfile: Dockerfile
    container_name: service_document_ingestion
    restart: always
    environment:
      PORT_DOCUMENT: 8001
      MINIO_ENDPOINT: "minio:9000"
      MINIO_ACCESS_KEY: "minio_admin"
      MINIO_SECRET_KEY: "MinioSecretPassword123!"
      MINIO_BUCKET: "metrology-certificates"
      POSTGRES_DSN: "postgres://metrology_admin:SecretPassword123!@postgres:5432/metrology_db?sslmode=disable"
      REDIS_URL: "redis://:RedisSecret123!@redis:6379/0"
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      ocr-parsing:
        condition: service_healthy
    networks:
      - metrology-net

  ocr-parsing:
    build:
      context: ./services/ocr-parsing
      dockerfile: Dockerfile
    container_name: service_ocr_parsing
    restart: always
    environment:
      PORT_OCR: 8002
      MINIO_PUBLIC_BASE_URL: "http://minio:9000"
      MINIO_BUCKET: "metrology-certificates"
      # Real extraction. Set to "true" only to serve fixture data while working
      # on the UI without a running OCR stack.
      MOCK_OCR: "false"
      # Optional vision refinement. Without a key the service still extracts
      # locally with RapidOCR; with one, measurement tables and header fields
      # are read far more reliably. Supplied from app/.env or the shell.
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OCR_VISION_MODEL: "${OCR_VISION_MODEL:-gpt-4o}"
      # Pages are rasterised to this longest side before OCR. 2000px keeps a
      # scanned A4 legible at ~250KB/page instead of ~13MB.
      OCR_RENDER_MAX_SIDE: "2000"
      OCR_PAGE_WORKERS: "4"
      LOG_LEVEL: "INFO"
    ports:
      - "8002:8002"
    networks:
      - metrology-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Model warm-up runs at startup; allow for it before probing.
      start_period: 90s

  metrology-engine:
    build:
      context: ./services/metrology-engine
      dockerfile: Dockerfile
    container_name: service_metrology_engine
    restart: always
    environment:
      PORT_METROLOGY: 8003
    ports:
      - "8003:8003"
    networks:
      - metrology-net

  ai-anomaly:
    build:
      context: ./services/ai-anomaly
      dockerfile: Dockerfile
    container_name: service_ai_anomaly
    restart: always
    environment:
      PORT_ANOMALY: 8004
    ports:
      - "8004:8004"
    networks:
      - metrology-net

  reporting-notification:
    build:
      context: ./services/reporting-notification
      dockerfile: Dockerfile
    container_name: service_reporting_notification
    restart: always
    environment:
      PORT_REPORTING: 8005
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: RedisSecret123!
      MINIO_HOST: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: minio_admin
      MINIO_SECRET_KEY: MinioSecretPassword123!
    ports:
      - "8005:8005"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - metrology-net

  web-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Next.js inlines NEXT_PUBLIC_* at build time, so this must be a build
        # arg rather than only a runtime variable.
        NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}"
    container_name: service_web_frontend
    restart: always
    environment:
      PORT: 3000
      NEXT_PUBLIC_API_BASE_URL: "${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}"
    ports:
      - "3000:3000"
    depends_on:
      - auth-gateway
    networks:
      - metrology-net
